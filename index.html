const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cats=['Family Meals','Baby Meals','Sourdough & Baking','Breakfast','Lunch','Dinner','Snacks','Desserts'];let state;try{state=JSON.parse(localStorage.getItem('myKitchenV1'))}catch{};state=state||{recipes:[],plan:{},checks:{},extra:{}};let tab='recipes',filter='',category='',fav=false,week=0;const save=()=>{localStorage.setItem('myKitchenV1',JSON.stringify(state)); if(cloudUser && !cloudBusy) queueCloud();};const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;function days(){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7+week*7);return Array.from({length:7},(_,i)=>{let x=new Date(d);x.setDate(x.getDate()+i);return x})}const slots=['Сніданок','Обід','Вечеря','Перекус'];const uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());function render(){ $('#nav').innerHTML=[['recipes','Рецепти'],['plan','Меню'],['shop','Покупки'],['settings','Дані']].map(([id,t])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${t}</button>`).join('');if(tab==='recipes')recipes();if(tab==='plan')planner();if(tab==='shop')shopping();if(tab==='settings')settings()}function go(t){tab=t;render()}function recipes(){let r=state.recipes.filter(r=>(!category||r.cat===category)&&(!fav||r.fav)&&[r.name,r.ingredients,r.tags].join(' ').toLowerCase().includes(filter.toLowerCase()));$('#app').innerHTML=`<div class="row"><h2>Мої рецепти</h2><button class="primary" onclick="edit()">+ Рецепт</button></div><button onclick="smartImport()" style="width:100%;margin:0 0 12px;background:#e3eadc">✨ Smart Import</button><input placeholder="Пошук рецептів…" value="${esc(filter)}" oninput="filter=this.value;listOnly()"><div class="row" style="margin:10px 0"><select onchange="category=this.value;render()"><option value="">Усі категорії</option>${cats.map(c=>`<option ${category===c?'selected':''}>${c}</option>`).join('')}</select><button onclick="fav=!fav;render()">${fav?'♥':'♡'} Обране</button></div><div id="cards"></div>`;listOnly()}function listOnly(){let r=state.recipes.filter(r=>(!category||r.cat===category)&&(!fav||r.fav)&&[r.name,r.ingredients,r.tags].join(' ').toLowerCase().includes(filter.toLowerCase()));$('#cards').innerHTML=r.length?`<div class="grid">${r.map(r=>`<article>${r.photo?`<img class="photo" src="${esc(r.photo)}">`:'<div class="placeholder">🍽️</div>'}<h3 style="margin-top:10px">${esc(r.name)}</h3><span class="tag">${esc(r.cat)}</span><p class="muted">${esc(r.time||'—')} хв · ${r.servings} порц.</p><div class="row"><button onclick="detail('${r.id}')">Відкрити</button><button onclick="toggleFav('${r.id}')">${r.fav?'♥':'♡'}</button></div></article>`).join('')}</div>`:'<div class="panel">Тут буде твоя колекція. Додай перший рецепт!</div>'}function toggleFav(id){let r=state.recipes.find(x=>x.id===id);r.fav=!r.fav;save();render()}function edit(id,draft){let r=state.recipes.find(x=>x.id===id)||{name:'',cat:cats[0],servings:2,...draft};$('#dlg').innerHTML=`<form id="recipeForm"><h2>${id?'Редагувати':'Новий рецепт'}</h2><label>Назва</label><input name="name" required value="${esc(r.name)}"><label>Категорія</label><select name="cat">${cats.map(c=>`<option ${r.cat===c?'selected':''}>${c}</option>`).join('')}</select><label>Теги</label><input name="tags" value="${esc(r.tags)}" placeholder="риба, швидко, овочі"><div class="row"><div><label>Порції</label><input type="number" min="1" name="servings" value="${r.servings}" required></div><div><label>Час, хв</label><input type="number" min="0" name="time" value="${esc(r.time)}"></div></div><label>Посилання на оригінал</label><input type="url" name="url" value="${esc(r.url)}"><label>Фото (необов’язково)</label><input type="file" accept="image/*" name="photo"><label>Інгредієнти — по одному на рядок</label><textarea name="ingredients" placeholder="200 г лосось&#10;1 tbsp оливкова олія">${esc(r.ingredients)}</textarea><label>Приготування</label><textarea name="steps">${esc(r.steps)}</textarea><div class="row"><button type="button" onclick="$('#dlg').close()">Скасувати</button><button class="primary">Зберегти</button></div></form>`;$('#dlg').showModal();$('#recipeForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),obj={id:r.id||uid(),fav:r.fav||false,photo:r.photo||''};for(let k of ['name','cat','tags','servings','time','url','ingredients','steps'])obj[k]=f.get(k);obj.servings=Number(obj.servings);let file=f.get('photo');if(file?.size){obj.photo=await new Promise((res,rej)=>{let rd=new FileReader();rd.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,700/im.width,700/im.height);c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.75))};im.onerror=rej;im.src=rd.result};rd.onerror=rej;rd.readAsDataURL(file)})}let old=state.recipes.slice();state.recipes=state.recipes.filter(x=>x.id!==obj.id);state.recipes.push(obj);try{save()}catch{state.recipes=old;alert('Недостатньо місця для збереження.');return}$('#dlg').close();render()}}function scale(line,f){return line.replace(/^(\d+(?:[.,]\d+)?)(?:\s+(\d+)\/(\d+)|\/(\d+))?/, (m,a,b,c,d)=>{let n=Number(a.replace(',','.'));if(b)n+=Number(b)/Number(c);if(d)n/=Number(d);return String(Math.round(n*f*100)/100)})}function detail(id){let r=state.recipes.find(x=>x.id===id);$('#dlg').innerHTML=`<h2>${esc(r.name)}</h2>${r.photo?`<img class="photo" src="${esc(r.photo)}">`:''}<p class="muted">${esc(r.cat)} · ${esc(r.tags)} · ${esc(r.time)} хв</p><label>Порції</label><input type="number" min="1" value="${r.servings}" onchange="$('#scaled').textContent=state.recipes.find(x=>x.id==='${id}').ingredients.split('\\n').map(l=>scale(l,Math.max(1,this.value)/${r.servings})).join('\\n')"><h3>Інгредієнти</h3><pre id="scaled">${esc(r.ingredients)}</pre><h3>Приготування</h3><pre>${esc(r.steps)}</pre>${/^https?:\/\//i.test(r.url)?`<p><a href="${esc(r.url)}" target="_blank" rel="noopener">Оригінальний рецепт</a></p>`:''}<div class="row"><button onclick="$('#dlg').close();edit('${id}')">Редагувати</button><button onclick="removeRecipe('${id}')">Видалити</button><button onclick="$('#dlg').close()">Закрити</button></div>`;$('#dlg').showModal()}function removeRecipe(id){if(!confirm('Видалити рецепт і його записи в меню?'))return;state.recipes=state.recipes.filter(r=>r.id!==id);for(let k in state.plan)state.plan[k]=state.plan[k].filter(x=>x.id!==id);save();$('#dlg').close();render()}function weekHead(){let d=days();return `<div class="row"><button onclick="week--;render()">‹</button><strong style="text-align:center">${d[0].toLocaleDateString('uk-UA',{day:'numeric',month:'short'})} – ${d[6].toLocaleDateString('uk-UA',{day:'numeric',month:'short'})}</strong><button onclick="week++;render()">›</button><button onclick="week=0;render()">Сьогодні</button></div>`}function planner(){$('#app').innerHTML=`<h2>Меню на тиждень</h2>${weekHead()}<p class="muted">Додавай кілька страв до одного прийому їжі: білок, гарнір, овочі.</p>${days().map(d=>`<article><h3>${d.toLocaleDateString('uk-UA',{weekday:'long',day:'numeric',month:'long'})}</h3>${slots.map((s,i)=>{let k=dateKey(d)+'|'+i;return `<div class="meal"><small>${s}</small><div>${(state.plan[k]||[]).map((x,j)=>`<div class="row" style="margin-bottom:5px"><span>${esc(state.recipes.find(r=>r.id===x.id)?.name)} · ${x.n} порц.</span><button onclick="moveMeal('${k}',${j})">↔</button><button onclick="delMeal('${k}',${j})">×</button></div>`).join('')}<button onclick="addMeal('${k}')">+ Додати</button></div></div>`}).join('')}</article>`).join('')}<button onclick="copyWeek()">Копіювати на наступний тиждень</button>`}function addMeal(k){if(!state.recipes.length){alert('Спочатку додай рецепт.');go('recipes');return}$('#dlg').innerHTML=`<form id="mf"><h2>Додати страву</h2><label>Рецепт</label><select name="id" onchange="this.form.n.value=state.recipes.find(r=>r.id===this.value).servings">${state.recipes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><label>Порції</label><input name="n" type="number" min="1" required value="${state.recipes[0].servings}"><button class="primary" style="margin-top:12px">Додати</button> <button type="button" onclick="$('#dlg').close()">Скасувати</button></form>`;$('#dlg').showModal();$('#mf').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);(state.plan[k]??=[]).push({id:f.get('id'),n:Number(f.get('n'))});save();$('#dlg').close();render()}}function delMeal(k,j){state.plan[k].splice(j,1);save();render()}function moveMeal(k,j){$('#dlg').innerHTML=`<form id="mv"><h2>Перенести страву</h2><label>Дата</label><input name="day" type="date" value="${k.split('|')[0]}" required><label>Прийом їжі</label><select name="slot">${slots.map((s,i)=>`<option value="${i}">${s}</option>`).join('')}</select><button class="primary">Перенести</button> <button type="button" onclick="$('#dlg').close()">Скасувати</button></form>`;$('#dlg').showModal();$('#mv').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),to=f.get('day')+'|'+f.get('slot'),x=state.plan[k].splice(j,1)[0];(state.plan[to]??=[]).push(x);save();$('#dlg').close();render()}}function copyWeek(){if(!confirm('Додати копії страв до наступного тижня?'))return;for(let d of days()){let n=new Date(d);n.setDate(n.getDate()+7);slots.forEach((_,i)=>{let a=state.plan[dateKey(d)+'|'+i]||[];if(a.length)(state.plan[dateKey(n)+'|'+i]??=[]).push(...a.map(x=>({...x})))})}save();week++;render()}function shopping(){let sums={},other=new Set(),wk=dateKey(days()[0]);for(let d of days())for(let i=0;i<4;i++)for(let x of state.plan[dateKey(d)+'|'+i]||[]){let r=state.recipes.find(r=>r.id===x.id);if(!r)continue;for(let l of r.ingredients.split('\n').map(x=>x.trim()).filter(Boolean)){let m=scale(l,x.n/r.servings).match(/^(\d+(?:\.\d+)?)\s+(.+)$/);if(m){let key=m[2].toLowerCase();sums[key]=(sums[key]||0)+Number(m[1])}else other.add(l)}}let items=[...Object.entries(sums).map(([k,v])=>[k,`${Math.round(v*100)/100} ${k}`]),...[...other].map(x=>[x,x]),...(state.extra[wk]||[]).map(x=>['extra:'+x,x])];let group=t=>/лосос|курк|куряч|м'яс|риба|shrimp|salmon|chicken|beef|кревет/i.test(t)?'М’ясо та риба':/молок|сир|йогурт|яйц|milk|cheese|egg|butter/i.test(t)?'Молочне та яйця':/моркв|брокол|цибул|томат|лимон|яблу|шпинат|carrot|onion|lemon|spinach|tomato|овоч/i.test(t)?'Овочі та фрукти':'Інше';$('#app').innerHTML=`<h2>Список покупок</h2>${weekHead()}<p class="muted">Кількості об’єднуються за однаковою назвою та одиницею. Перевір список перед покупками.</p><form id="extra" class="row"><input name="item" required placeholder="Додати продукт"><button>+</button></form>${['Овочі та фрукти','М’ясо та риба','Молочне та яйця','Інше'].map(g=>{let a=items.filter(x=>group(x[1])===g);return a.length?`<article><h3>${g}</h3>${a.map(([k,t])=>`<label class="check"><input type="checkbox" ${state.checks[wk+'|'+k]?'checked':''} data-key="${esc(wk+'|'+k)}" onchange="state.checks[this.dataset.key]=this.checked;save()"><span>${esc(t)}</span>${k.startsWith('extra:')?`<button type="button" data-item="${esc(t)}" onclick="state.extra['${wk}']=state.extra['${wk}'].filter(x=>x!==this.dataset.item);save();render()">×</button>`:''}</label>`).join('')}</article>`:''}).join('')||'<p>Додай страви до меню або продукти вручну.</p>'}`;$('#extra').onsubmit=e=>{e.preventDefault();let t=new FormData(e.target).get('item').trim();if(t&&!(state.extra[wk]||[]).includes(t))(state.extra[wk]??=[]).push(t);save();render()}}function settings(){$('#app').innerHTML=`<h2>Мої дані</h2><article><p>Рецепти та меню зберігаються локально в цьому браузері. Створюй резервні копії, щоб не втратити дані.</p><button class="primary" onclick="backup()">Експорт JSON</button><label>Відновити резервну копію (замінює поточні дані)</label><input type="file" accept=".json" onchange="restore(this)"></article><article><h3>Про версію</h3><p>Хмарне збереження доступне після входу. Smart Import підтримує текст, скриншоти та доступні сайти. Конвертація одиниць ще не підключена.</p></article>`}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='my-kitchen-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(el){try{let s=JSON.parse(await el.files[0].text());if(!Array.isArray(s.recipes)||!s.plan||!s.checks||!s.extra||!s.recipes.every(r=>typeof r.id==='string'&&/^[\w.-]+$/.test(r.id)&&typeof r.ingredients==='string'&&Number(r.servings)>0))throw Error();if(confirm('Замінити поточні дані?')){state=s;save();render()}}catch{alert('Не вдалося відновити файл.')}}
const CLOUD_CONFIG={"url":"https://pvgpbpgwzatxjzqudgze.supabase.co","key":"sb_publishable_4bczdldZAzdvBgCiZHtuCA_Tqy7iEqP"};
let cloud=null,cloudUser=null,cloudBusy=false,cloudTimer=null,cloudRevision=null,cloudDirty=false,cloudWriting=false;
function cloudStatus(t){$('#cloudStatus').textContent=t;}
function cloudDialog(){let cfg=CLOUD_CONFIG;$('#dlg').innerHTML=`<h2>Cloud account</h2><p>Створи особистий акаунт або увійди, щоб синхронізувати рецепти.</p><form id="login"><label>Email</label><input name="email" type="email" required><label>Пароль</label><input name="password" type="password" minlength="8" required><button name="action" value="login">Увійти</button> <button name="action" value="signup">Створити акаунт</button></form><p><button onclick="pullCloud()">Завантажити з хмари</button> <button onclick="pushCloud()">Зберегти в хмару</button> <button onclick="logoutCloud()">Вийти</button></p><button onclick="$('#dlg').close()">Закрити</button>`;$('#dlg').showModal();$('#login').onsubmit=async e=>{e.preventDefault();if(!cloud)return alert('Спочатку підключи Supabase');let f=new FormData(e.target),cred={email:f.get('email'),password:f.get('password')};let result=e.submitter.value==='signup'?await cloud.auth.signUp({...cred,options:{emailRedirectTo:new URL("./",location.href).href}}):await cloud.auth.signInWithPassword(cred);if(result.error)return alert(result.error.message);if(result.data.session){await connectUser(result.data.session.user);$('#dlg').close();}else alert('Перевір email для підтвердження акаунта.');};}
async function initCloud(){try{let cfg=CLOUD_CONFIG;if(!cfg.url||!cfg.key)return;if(!window.supabase)throw Error('SDK unavailable');cloud=window.supabase.createClient(cfg.url,cfg.key);let {data,error}=await cloud.auth.getSession();if(error)throw error;if(data.session)await connectUser(data.session.user);else cloudStatus('Sign in to sync');}catch(e){cloudStatus('Cloud unavailable: '+e.message);}}
async function connectUser(user){cloudBusy=true;cloudUser=user;try{let {data,error}=await cloud.from('kitchen_state').select('payload,updated_at').eq('user_id',user.id).maybeSingle();if(error)throw error;cloudRevision=data?.updated_at||null;if(data){if(!state.recipes.length&&!Object.keys(state.plan).length||confirm('Завантажити хмарну версію замість локальної?')){state=data.payload;localStorage.setItem('myKitchenV1',JSON.stringify(state));render();}else{cloudUser=null;cloudStatus('Sync paused: local data preserved');return;}}else if(confirm('Зберегти поточну локальну колекцію в цьому акаунті?')){cloudBusy=false;await pushCloud();}else{cloudUser=null;cloudStatus('Sync paused');return;}cloudStatus('Cloud connected');}catch(e){cloudUser=null;cloudStatus('Sync error: '+e.message);}finally{cloudBusy=false;}}
function queueCloud(){cloudDirty=true;clearTimeout(cloudTimer);cloudTimer=setTimeout(pushCloud,800);cloudStatus('Unsynced changes');}
async function pushCloud(){if(!cloudUser||cloudBusy||cloudWriting)return;cloudWriting=true;cloudDirty=false;let payload=JSON.parse(JSON.stringify(state)),stamp=new Date().toISOString();try{let q=cloudRevision?cloud.from('kitchen_state').update({payload,updated_at:stamp}).eq('user_id',cloudUser.id).eq('updated_at',cloudRevision):cloud.from('kitchen_state').insert({user_id:cloudUser.id,payload,updated_at:stamp});let {data,error}=await q.select('updated_at').single();if(error)throw error;cloudRevision=data.updated_at;cloudStatus('Saved to cloud');}catch(e){cloudDirty=true;cloudStatus('Not synced — export backup or reload cloud');console.error(e);return;}finally{cloudWriting=false;}if(cloudDirty)queueCloud();}
async function pullCloud(){if(!cloudUser)return alert('Спочатку увійди');if(cloudWriting)return alert('Збереження ще триває');if(!confirm('Замінити локальну версію хмарною?'))return;clearTimeout(cloudTimer);cloudDirty=false;await connectUser(cloudUser);}
async function logoutCloud(){if(cloudWriting||cloudDirty)return alert('Спочатку збережи зміни або експортуй резервну копію.');if(cloud)await cloud.auth.signOut();cloudUser=null;cloudRevision=null;cloudStatus('Local mode');}

function smartText(t){let lines=t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean), name='',ingredients=[],steps=[],mode='',servings=2;for(let line of lines){if(/^https?:\/\//i.test(line))continue;let m=line.match(/^(?:ingredients|інгредієнти|склад|продукти)\s*[:：]?\s*(.*)$/i);if(m){mode='i';if(m[1])ingredients.push(m[1]);continue;}m=line.match(/^(?:instructions|directions|method|preparation|приготування|спосіб приготування|рецепт приготування)\s*[:：]?\s*(.*)$/i);if(m){mode='s';if(m[1])steps.push(m[1]);continue;}m=line.match(/^(?:servings|порції|порцій)\s*[:：]?\s*(\d+)/i);if(m){servings=Number(m[1]);continue;}if(!name&&!mode&&!/^[\d•*-]/.test(line)){name=line;continue;}if(mode==='i'||(!mode&&/^[•*-]?\s*[\d¼½¾⅓⅔]/.test(line)))ingredients.push(line.replace(/^[•*-]\s*/,''));else steps.push(line);}return {name,ingredients:ingredients.join('\n'),steps:steps.join('\n'),servings};}
function smartImport(){const d=$('#dlg');d.innerHTML='<h2>✨ Smart Import</h2><p class="muted">Встав посилання, опис або розпізнай текст зі скриншота. Перед збереженням перевір рецепт.</p><label>Посилання на рецепт / Instagram</label><input id="importUrl" type="url" placeholder="https://..."><button type="button" id="importFetch" style="margin-top:8px">Отримати рецепт за посиланням</button><label>Скриншот рецепта</label><input id="importImage" type="file" accept="image/*"><button type="button" id="importOCR" style="margin-top:8px">Розпізнати текст</button><label>Опис або текст рецепта</label><textarea id="importText" placeholder="Назва, інгредієнти, приготування..." style="min-height:160px"></textarea><p id="importStatus" class="muted" role="status"></p><div class="row"><button onclick="$(\'#dlg\').close()">Скасувати</button><button class="primary" id="importReview">Перевірити рецепт</button></div>';d.showModal();let extracted=null;const status=t=>{if($('#importStatus'))$('#importStatus').textContent=t;};$('#importFetch').onclick=async()=>{let url=$('#importUrl').value.trim();if(!/^https:\/\//i.test(url))return status('Введи посилання https://.');if(!cloudUser)return status('Увійди в Cloud account або встав текст рецепта.');const b=$('#importFetch');b.disabled=true;status('Отримуємо рецепт…');try{let {data,error}=await cloud.functions.invoke('recipe-import',{body:{url}});if(error||data?.error)throw Error(data?.error||'Сайт не надав доступ. Скопіюй опис або додай скриншот.');if(data.recipe){extracted=data.recipe;$('#importText').value=[data.recipe.name,'Інгредієнти:',data.recipe.ingredients,'Приготування:',data.recipe.steps].join('\n');status('Рецепт знайдено. Перевір текст.');}else{extracted=null;if(data.caption)$('#importText').value=new DOMParser().parseFromString('<!doctype html><body>'+data.caption,'text/html').body.textContent;status(data.warning||'Встав текст вручну.');}}catch(e){status(e.message);}finally{b.disabled=false;}};$('#importOCR').onclick=async()=>{const file=$('#importImage').files[0];if(!file)return status('Спочатку вибери скриншот.');const b=$('#importOCR');b.disabled=true;let worker;try{status('Завантажуємо розпізнавання…');if(!window.Tesseract)await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=resolve;s.onerror=reject;document.head.append(s);});worker=await Tesseract.createWorker('eng+ukr',1,{logger:m=>{if(m.status==='recognizing text')status('Розпізнавання: '+Math.round(m.progress*100)+'%');}});const result=await worker.recognize(file);if($('#importText')){$('#importText').value=result.data.text;extracted=null;status('Перевір розпізнаний текст: можливі помилки.');}}catch(e){status('Не вдалося розпізнати. Встав текст вручну.');}finally{if(worker)await worker.terminate();b.disabled=false;}};$('#importReview').onclick=()=>{const text=$('#importText').value.trim(),url=$('#importUrl').value.trim();if(!text&&!url)return status('Додай текст або посилання.');let r=smartText(text);if(extracted){r.servings=Number(extracted.servings)||2;let m=String(extracted.time).match(/^PT(?:(\d+)H)?(?:(\d+)M)?$/);if(m)r.time=Number(m[1]||0)*60+Number(m[2]||0);}r.url=/^https?:\/\//i.test(url)?url:'';d.close();edit(undefined,r);};}
